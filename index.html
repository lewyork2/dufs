<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>我的相册</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f4f4f4;padding:20px}
h1{text-align:center;margin-bottom:30px;color:#333}
.container{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.item{background:#fff;padding:10px;border-radius:8px}
.item img{width:100%;height:auto;display:block;border-radius:4px}
</style>
</head>
<body>
<h1>我的照片相册</h1>
<div class="container">
  <div class="item"><img src="01.jpg"></div>
  <!-- 示例：<div class="item"><img src="test1.jpg"></div> -->
  <!-- 以后加图片，就在这里复制一行，改文件名 -->
</div>
</body>
</html>
